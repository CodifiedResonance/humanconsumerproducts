<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human Consumer Products</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0d0b09;--card:#14110e;--line:#2a241e;--rule:#221d18;--ink:#f2ece3;--soft:#d8cdbf;--mute:#b3a898;--amber:#f0b46a;--cool:#a9b8ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--amber)}a:hover{color:#ffd29a}
.serif{font-family:"Instrument Serif","Iowan Old Style",Georgia,serif;font-weight:400}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.kick{margin:0;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,64px)}
header.top{border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-top:18px;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand span{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:999px;color:var(--soft);text-decoration:none;font-size:15px}
nav a:hover{color:var(--ink);background:#17130f}
nav a[aria-current="page"]{color:#1a1208;background:var(--amber)}
section.band{border-top:1px solid var(--rule)}
section.band .wrap{padding-top:clamp(64px,8vw,112px);padding-bottom:clamp(64px,8vw,112px);display:flex;flex-direction:column;gap:28px}
h1,h2,h3{margin:0}
h2.big{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(34px,4.8vw,58px);line-height:1.06;text-wrap:balance}
p{margin:0}
.lead{max-width:680px;color:var(--soft);font-size:clamp(17px,1.5vw,19px);text-wrap:pretty}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:28px;line-height:1.1}
.card p{color:var(--soft);font-size:16px}
.tag{align-self:flex-start;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:4px 10px;border:1px solid #5d5246;color:var(--soft)}
.tag.yes{background:var(--amber);border-color:var(--amber);color:#1a1208}
.tag.part{border-color:var(--cool);color:#dfe5ff}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--amber);background:var(--amber);color:#1a1208;font:500 15px/1 Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{background:#ffc98a;color:#1a1208}
.btn.ghost{background:transparent;color:var(--ink);border-color:#5d5246}
.btn.ghost:hover{border-color:var(--amber);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.chip{appearance:none;height:44px;padding:0 18px;border-radius:999px;border:1px solid #3d342b;background:#16120f;color:#efe7dc;font:500 15px/1 Inter,system-ui,sans-serif;cursor:pointer}
.chip:hover{border-color:#7a654b}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1a1208}
.keep{appearance:none;height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--cool);background:transparent;color:#dfe5ff;font:500 15px/1 Inter,system-ui,sans-serif;cursor:pointer}
.keep:disabled{opacity:.4;cursor:default}
.chip:focus-visible,.keep:focus-visible,.btn:focus-visible,nav a:focus-visible{outline:2px solid var(--cool);outline-offset:3px}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:clamp(28px,5vw,56px);padding-bottom:clamp(48px,6vw,80px)}
.stage{position:relative;width:100%;height:clamp(400px,48vw,620px)}
.stage canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.steps li::before{counter-increment:s;content:counter(s);width:32px;height:32px;border-radius:999px;border:1px solid var(--amber);color:var(--amber);display:flex;align-items:center;justify-content:center;font:12px "JetBrains Mono",monospace}
.steps h3{font-size:18px;font-weight:600;margin-bottom:4px}
.steps p{color:var(--soft);font-size:16px}
.steps .meta{margin-top:8px;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.06em;color:var(--mute)}
.brief{max-width:760px;display:flex;flex-direction:column;gap:26px}
.brief h3{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.brief p,.brief li{color:var(--soft)}
.brief ul{margin:0;padding-left:20px;display:grid;gap:6px}
.note{font-size:14px;color:var(--mute)}

footer{border-top:1px solid var(--rule)}
footer .wrap{padding-top:28px;padding-bottom:40px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font:12px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--mute)}
.title{font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:clamp(40px,6.4vw,84px);line-height:1;letter-spacing:-.025em;max-width:1000px;text-wrap:balance}
h2.big{font-family:Inter,system-ui,sans-serif!important;font-weight:500!important;letter-spacing:-.02em;font-size:clamp(28px,3.6vw,44px)!important}
.card h3{font-family:Inter,system-ui,sans-serif!important;font-weight:500!important;font-size:22px!important;letter-spacing:-.01em}
.small{font-size:13px;color:var(--mute)}
.kv{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:-0 -1px -1px 0}
.kv dt{font:11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kv dd{margin:4px 0 0;color:var(--ink)}
.table{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tr{display:grid;grid-template-columns:110px minmax(0,2fr) minmax(0,1.4fr) 130px;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.tr.v{grid-template-columns:80px 120px minmax(0,1fr)}
a.tr:hover{background:#17130f;color:var(--ink)}
.th{border-top:0;font:11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);background:#110e0c}
@media (max-width:640px){.tr{grid-template-columns:90px minmax(0,1fr)}.tr span:nth-child(3),.tr span:nth-child(4){display:none}.tr.v{grid-template-columns:60px minmax(0,1fr)}.tr.v span:nth-child(2){display:none}.tr.v span:nth-child(3){display:block}}
@media print{header.top,footer,nav,.noprint{display:none!important}body{background:#fff;color:#111}.brief p,.brief li{color:#222}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="#index" aria-label="Human Consumer Products, index">
<svg width="34" height="20" viewBox="0 0 34 20" aria-hidden="true"><path d="M2 7 L2 12 A15 5 0 0 0 32 12 L32 7" fill="#1d1915" stroke="#8f8273"/><ellipse cx="17" cy="7" rx="15" ry="5" fill="#221d18" stroke="#c9a46a"/><ellipse cx="17" cy="7" rx="8.5" ry="2.6" fill="#0f0d0b" stroke="#f0b46a"/></svg>
<span>Human Consumer Products</span></a>
<nav aria-label="Main" id="nav"></nav>
</div></header>
<main id="app"></main>
<footer><div class="wrap"><span>Human Consumer Products · Concepts from human minds, for humans</span><span>humanconsumerproducts.com</span></div></footer>
<script>class DCLogic{constructor(){this.props={};this.state={};}setState(p){Object.assign(this.state,typeof p==='function'?p(this.state):p);if(this.onState)this.onState();}}</script>
<script src="engine.js"></script>
<script src="creators.js"></script>
<script src="site.js"></script>
</body>
</html>
